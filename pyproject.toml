[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

# Third-party libraries without bundled type information. Ignoring their
# missing stubs does not weaken type-checking of our own code.
[[tool.mypy.overrides]]
module = [
    "boto3",
    "botocore.*",
]
ignore_missing_imports = true

[tool.ruff]
# Only enforce rules that catch real bugs or security issues.
# Stylistic / aspirational checks (unused imports, formatting, etc.) are omitted.
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (syntax-level problems)
    "B",   # flake8-bugbear (likely bugs and design issues)
    "S",   # flake8-bandit (security)
]
ignore = [
    "S101",   # use of assert — fine in tests
    "E501",   # line too long — stylistic, not a bug
    "B017",   # assert on broad Exception — acceptable in tests
]
